services:
  - type: web
    name: bangladesh-voter-python
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bangladesh-voter-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads

databases:
  - name: bangladesh-voter-db
    databaseName: voter
    user: voter
    plan: free
    region: oregon
