name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ben

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --prefer-binary --disable-pip-version-check -r requirements.txt
          python -m pip install --prefer-binary --disable-pip-version-check pytest==8.4.1 httpx==0.28.1

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run smoke tests
        run: python -m pytest -q
